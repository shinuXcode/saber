name: saber
description: A cross-platform libre notes app

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.36.1+136010

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.5
  material_symbols_icons: ^4.2758.0

  sbn:
    path: packages/sbn

  dynamic_color: ^1.5.4
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^17.0.0
  path_to_regexp: ^0.4.0
  perfect_freehand: ^2.5.1
  path_provider: ^2.0.11
  flutter_secure_storage: ^11.0.0

  # Required for .sbn2 BSON serialization and legacy note compatibility.
  bson: ^5.0.8
  fixnum: ^1.1.1
  worker_manager: ^7.2.9

  url_launcher: ^6.1.8
  collapsible: ^1.0.0
  vector_math: ^2.1.2
  intl: any
  crypto: ^3.0.2
  encrypt: ^5.0.1
  http: ^1.1.0
  keybinder: ^1.0.1
  pdf: ^3.8.4
  share_plus: ^13.3.0
  file_picker: ^13.0.0
  android_file_picker:

  regexed_validator: ^2.0.0+1
  slang: ^4.12.1
  slang_flutter:
  flex_color_picker: ^3.4.1
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.0+1
  defer_pointer: ^0.0.2
  permission_handler: ^13.0.0
  saver_gallery: ^5.1.0
  animations: ^2.0.7
  flutter_quill: ^11.5.1
  window_manager: ^0.5.1
  archive: ^4.0.3
  flutter_sharing_intent: ^2.0.4

  onyxsdk_pen:
    path: packages/onyxsdk_pen

  screenshot: ^3.0.0
  path_drawing: ^1.0.1
  printing: ^5.13.2
  pool: ^1.5.1
  open_file: ^4.0.0
  super_clipboard: ^0.10.0-dev.2
  fast_image_resizer: ^0.0.2
  flutter_speed_dial: ^7.0.0
  logging: ^1.2.0
  device_info_plus: ^13.2.0
  yaru: ^10.2.0
  one_dollar_unistroke_recognizer: ^1.1.1
  meta: ^1.0.0
  collection: ^1.0.0
  args: ^2.5.0
  pdfrx: ">=2.4.2 <2.5.0"
  path: ^1.9.1
  stow: ^0.6.0
  stow_plain: ^0.6.0
  stow_secure: ^0.7.0
  stow_codecs: ^1.4.0
  flutter_hooks: ^0.21.3+1
  dynamic_yaru: ^0.2.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.0
  yaml: ^3.1.2
  golden_screenshot: ^11.1.0

dependency_overrides:
  flutter_speed_dial:
    git:
      url: https://github.com/adil192/flutter_speed_dial.git
      ref: fix/remove-Future.delayed
  native_toolchain_rust: 1.0.4+0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.svg
    - assets/images/
    - assets/google_fonts/Atkinson_Hyperlegible_Next/OFL.txt
    - assets/google_fonts/Dekko/OFL.txt
    - assets/google_fonts/Fira_Mono/OFL.txt
    - assets/google_fonts/Neucha/OFL.txt
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Atkinson_Hyperlegible_Next/AtkinsonHyperlegibleNext-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: Dekko
      fonts:
        - asset: assets/google_fonts/Dekko/Dekko-Regular.ttf
    - family: FiraMono
      fonts:
        - asset: assets/google_fonts/Fira_Mono/FiraMono-Regular.ttf
        - asset: assets/google_fonts/Fira_Mono/FiraMono-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Fira_Mono/FiraMono-Bold.ttf
          weight: 700
    - family: Neucha
      fonts:
        - asset: assets/google_fonts/Neucha/Neucha-Regular.ttf
  shaders:
    - shaders/pencil.frag

icons_launcher:
  image_path: "assets/icon/icon.png"
  platforms:
    android:
      enable: true
      adaptive_background_color: "#ffc800"
      adaptive_foreground_image: "assets/icon/icon_maskable.png"
      adaptive_monochrome_image: "assets/icon/icon_monochrome.png"
    ios:
      enable: true
      image_path: "assets/icon/icon_opaque.png"
      dark_path: "assets/icon/icon_ios_dark.png"
      tinted_path: "assets/icon/icon_ios_tintable.png"
    linux:
      enable: false
    windows:
      enable: true
    macos:
      enable: true
      image_path: "assets/icon/icon_macos.png"
